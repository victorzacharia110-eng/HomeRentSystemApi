name: familybiz
region: us

build:
  commands:
    - composer install --no-dev --optimize-autoloader
    - php artisan optimize
    - npm install
    - npm run build

web:
  commands:
    - php artisan serve --host=0.0.0.0 --port=8080
  
  routes:
    # CRITICAL: API routes MUST be handled by PHP
    - path: /api/*
      handler: php
    # All other routes go to SPA
    - path: /*
      handler: spa

spa:
  build:
    commands:
      - npm install
      - npm run build
  output: dist